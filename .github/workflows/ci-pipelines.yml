name: TalentStream CI Pipelines

on:
  push:
    branches: ["main"]

jobs:
  build-and-push-images:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Java Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend-java
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/talentstream-backend-java:latest

      - name: Build & Push Python AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/talentstream-ai-service:latest

      - name: Build & Push React Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-react
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/talentstream-frontend:latest

      - name: Build & Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/talentstream-api-gateway:latest
