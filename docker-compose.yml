version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: talentstream_db
    command: postgres -c timezone=UTC
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: talentstream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: talentstream_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: talentstream_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    container_name: talentstream-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: talentstream-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: talentstream_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: talentstream-zipkin
    ports:
      - "9411:9411"

  backend-java:
    image: talentstream-backend-java
    container_name: talentstream-backend-java
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
      - kafka
      - zipkin
    environment:
      - DB_HOST=postgres-db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    volumes:
      - shared_uploads:/app/uploads

  ai-service:
    image: talentstream-ai-service
    container_name: talentstream-ai-service
    ports:
      - "5000:5000"
    depends_on:
      - kafka
      - backend-java
      - zipkin
    environment:
      - KAFKA_BROKER=kafka:29092
      - BACKEND_URL=http://backend-java:8080
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - JAVA_BACKEND_DIR=/app
    volumes:
      - shared_uploads:/app/uploads

  api-gateway:
    image: talentstream-api-gateway
    container_name: talentstream-api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - backend-java
      - redis
      - zipkin
    environment:
      - REDIS_HOST=redis
      - BACKEND_URI=http://backend-java:8080
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - FRONTEND_URL=http://localhost:5173

  frontend-react:
    image: talentstream-frontend
    container_name: talentstream-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  grafana_data:
  shared_uploads: