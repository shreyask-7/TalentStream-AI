server:
  port: 8000

eureka:
  client:
    enabled: false

spring:
  application:
    name: api-gateway

  # ---------------------------------------------------------
  # Redis Connection
  # ---------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # ---------------------------------------------------------
  # Gateway Routing
  # ---------------------------------------------------------
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${BACKEND_URI:http://localhost:8080}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        - id: job-service
          uri: ${BACKEND_URI:http://localhost:8080}
          predicates:
            - Path=/api/jobs/**

        - id: backend-java-applications
          uri: ${BACKEND_URI:http://localhost:8080}
          predicates:
            - Path=/api/applications/**

        - id: analytics-service
          uri: ${BACKEND_URI:http://localhost:8080}
          predicates:
            - Path=/api/analytics/**

# ---------------------------------------------------------
# Observability: Actuator, Prometheus & Zipkin
# ---------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"