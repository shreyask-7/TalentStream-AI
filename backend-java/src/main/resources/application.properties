spring.application.name=backend-java

# ---------------------------------------------------------
# Database Connection Settings
# ---------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/talentstream?options=-c%20TimeZone=UTC
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------
# Kafka Settings
# ---------------------------------------------------------
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topic.job-created=job-created

# ---------------------------------------------------------
# Observability: Actuator, Prometheus & Zipkin
# ---------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Zipkin Distributed Tracing config
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# ---------------------------------------------------------
# M2M Security Credentials (Python AI <-> Java Backend)
# ---------------------------------------------------------
m2m.client.id=ai-vector-engine-v1
m2m.client.secret=super-secret-cryptographic-key-change-in-prod