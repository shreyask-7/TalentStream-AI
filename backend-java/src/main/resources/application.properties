spring.application.name=backend-java

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/talentstream?options=-c%20TimeZone=UTC
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Kafka Settings
spring.kafka.bootstrap-servers=localhost:9092
app.kafka.topic.job-created=job-created

# Actuator & Prometheus Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
# Tags every metric with the app name so Grafana knows where it came from
management.metrics.tags.application=${spring.application.name}

# M2M Security Credentials (Python AI <-> Java Backend)
m2m.client.id=ai-vector-engine-v1
m2m.client.secret=super-secret-cryptographic-key-change-in-prod